<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>N Reinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Problema de las N Reinas</h1>

    <div class="contenedor">

        <label>Ingrese N:</label>
        <input type="number" id="n" value="8" min="8">

        <button id="btnResolver">Resolver</button>
        <button id="btnSiguiente" disabled>Siguiente solución</button>

        <p id="mensaje">Ingrese un número mayor o igual a 8.</p>

        <div class="tableros">
            <div>
                <h2>Proceso</h2>
                <div id="tableroProceso" class="tablero"></div>
            </div>

            <div>
                <h2>Solución</h2>
                <div id="tableroSolucion" class="tablero"></div>
            </div>
        </div>

        <h2>Arreglo de columnas</h2>
        <p id="arreglo">[]</p>

    </div>

    <script src="n_reinas.js"></script>
</body>
</html>
